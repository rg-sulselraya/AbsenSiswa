name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "apps-script/**"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          CLASP_SCRIPT_ID: ${{ vars.CLASP_SCRIPT_ID }}
          CLASP_DEPLOYMENT_ID: ${{ vars.CLASP_DEPLOYMENT_ID }}
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          missing=0
          if [ -z "$CLASP_SCRIPT_ID" ]; then
            echo "Missing repository variable: CLASP_SCRIPT_ID"
            missing=1
          fi
          if [ -z "$CLASP_DEPLOYMENT_ID" ]; then
            echo "Missing repository variable: CLASP_DEPLOYMENT_ID"
            missing=1
          fi
          if [ -z "$CLASP_CREDENTIALS" ]; then
            echo "Missing repository secret: CLASP_CREDENTIALS"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure the Apps Script ID, existing deployment ID, and clasp credentials before running this workflow."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install --global @google/clasp@latest

      - name: Configure clasp
        working-directory: apps-script
        env:
          CLASP_SCRIPT_ID: ${{ vars.CLASP_SCRIPT_ID }}
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"%s"}\n' "$CLASP_SCRIPT_ID" "$GITHUB_WORKSPACE/apps-script" > .clasp.json

      - name: Push source and update existing Web App deployment
        working-directory: apps-script
        env:
          CLASP_DEPLOYMENT_ID: ${{ vars.CLASP_DEPLOYMENT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          clasp push --force
          clasp deploy --deploymentId "$CLASP_DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA}"
